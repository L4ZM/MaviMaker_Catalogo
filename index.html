const container = document.getElementById("productsContainer");

function renderProducts(){
  const search = document.getElementById("searchInput").value.toLowerCase();
  container.innerHTML = "";

  const filtered = products.filter(p => {
    const matchCategory = currentFilter === "Todos" || p.category === currentFilter;
    const matchSearch =
      p.title.toLowerCase().includes(search) ||
      p.category.toLowerCase().includes(search) ||
      p.tag.toLowerCase().includes(search);

    return matchCategory && matchSearch;
  });

  filtered.forEach((p) => {
    const originalIndex = products.indexOf(p);
    const card = document.createElement("div");
    card.className = "product";
    card.onclick = () => openModal(originalIndex);

    card.innerHTML = `
      <div class="product-img">
        <img 
          src="${imgUrl(p.image)}" 
          alt="${p.title}"
          onerror="this.src='assets/logo-mavimaker.svg'; this.style.background='#222'; this.style.padding='25px'; this.style.objectFit='contain';"
        >
      </div>
      <span class="tag">${p.tag}</span>
      <h3>${p.title}</h3>
      <p>${p.description}</p>
      <div class="price">${p.price}</div>
      <button class="btn btn-pink" onclick="openModal(${originalIndex}); event.stopPropagation();">
        Ver detalles
      </button>
    `;

    container.appendChild(card);
  });
}

function filterProducts(category){
  currentFilter = category;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("active");
    if(btn.innerText === category) btn.classList.add("active");
    if(category === "Todos" && btn.innerText === "Todos") btn.classList.add("active");
  });

  renderProducts();
}

function openModal(index){
  const p = products[index];

  document.getElementById("modalMainImage").innerHTML =
    `<img 
      src="${imgUrl(p.image)}" 
      alt="${p.title}"
      onerror="this.src='assets/logo-mavimaker.svg'; this.style.background='#222'; this.style.padding='25px'; this.style.objectFit='contain';"
    >`;

  document.getElementById("modalTitle").innerText = p.title;
  document.getElementById("modalPrice").innerText = p.price;
  document.getElementById("modalDescription").innerText = p.description;
  document.getElementById("modalCategory").innerText = p.category;
  document.getElementById("modalCustom").innerText = p.custom;
  document.getElementById("modalTime").innerText = p.time;
  document.getElementById("modalNote").innerText = p.note;

  const gallery = document.getElementById("modalGallery");
  gallery.innerHTML = "";

  p.gallery.forEach(img => {
    const div = document.createElement("div");
    div.innerHTML = `
      <img 
        src="${imgUrl(img)}" 
        alt="${p.title}" 
        onclick="changeMainImage('${imgUrl(img)}')"
        onerror="this.src='assets/logo-mavimaker.svg'; this.style.background='#222'; this.style.padding='10px'; this.style.objectFit='contain';"
      >
    `;
    gallery.appendChild(div);
  });

  const text = encodeURIComponent(`Hola, quiero pedir o cotizar este producto: ${p.title}`);
  document.getElementById("modalWhatsapp").href = `https://wa.me/${phone}?text=${text}`;

  document.getElementById("productModal").style.display = "block";
}

function changeMainImage(img){
  document.getElementById("modalMainImage").innerHTML =
    `<img src="${img}" alt="Producto">`;
}

function closeModal(){
  document.getElementById("productModal").style.display = "none";
}

window.onclick = function(event){
  const modal = document.getElementById("productModal");
  if(event.target === modal){
    closeModal();
  }
}

renderProducts();
